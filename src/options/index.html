<!DOCTYPE html>
<html lang="en">
<head>
  <title>GoldMind Extension Settings</title>
  <style>
    .hint {
      font-size: 90%;
    }
  </style>
</head>

<body>
  <main>
    <input type="checkbox" id="badge">
    <label for="badge">Enable extension badge</label>
    <p class="hint">
        By default, the extension button displays the number of annotations found
        on the pages you visit. Disable this if you find the badge distracting or
        if you do not wish the extension to make requests to the GoldMind
        service for this data.
    </p>

    <hr>
    <h2>ChatUI settings</h2>
    <form id="config-form">
      <label for="url">URL:</label><br>
      <input type="text" id="url" name="url"><br>

      <label for="model">Model:</label><br>
      <select id="model" name="model">
        <option value="">-- Choose a model --</option>
      </select><br>

      <label for="token">Token:</label><br>
      <input type="text" id="token" name="token"><br>

      <input type="submit" value="Submit">
    </form>

    <hr>
    <h2>Model Settings</h2>
    <ul id="model-list">
    </ul>
    <form id="option-form">
      <label for="option">Option:</label><br>
      <input type="text" id="option" name="option"><br>
      <input type="submit" value="Update">
    </form>

    <script src="options.js"></script>
  </main>
</body>
</html>
